name: price-check
on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'File a test alert issue regardless of price movement'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency: price-check
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet playwright
      - name: Check price
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
        run: python3 check_price.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "osl-tracker-bot"
          git config user.email "osl-tracker@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "price check $(date -u +%FT%TZ)"
          git push
      # A GitHub issue is the notification channel that actually reaches a phone:
      # GitHub emails the repo owner on issues opened by the actions bot (and the
      # GitHub mobile app pushes). Gmail-MCP drafts and short-lead calendar events
      # from the cloud routine both proved silent.
      - name: Alert via GitHub issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          alert=$(jq -r '.ok and .alert' verdict.json 2>/dev/null || echo false)
          [ "$alert" = "true" ] || [ "$TEST_ALERT" = "true" ] || exit 0
          if [ "$alert" = "true" ]; then
            title="$(jq -r '.alerts[0]' verdict.json)"
          else
            title="TEST ALERT: GA \$$(jq -r '.ga' verdict.json) (plumbing check, close me)"
          fi
          {
            echo "GA: \$$(jq -r '.ga' verdict.json) (prev \$$(jq -r '.prev_ga' verdict.json), all-time low \$$(jq -r '.alltime_low_ga' verdict.json), check #$(jq -r '.n_checks' verdict.json))"
            echo ""
            echo "All tiers: \`$(jq -c '.prices' verdict.json)\`"
            echo ""
            echo "Last 10 checks (UTC):"
            echo '```'
            tail -10 history.jsonl | jq -r '"\(.ts)  GA $\(.prices.GA // "?")"'
            echo '```'
            echo ""
            echo "Buy now: $(jq -r '.event_url' verdict.json)"
          } > /tmp/issue_body.md
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/issue_body.md
      - name: Email alert (Gmail SMTP)
        if: always()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          [ -n "$GMAIL_APP_PASSWORD" ] || { echo "GMAIL_APP_PASSWORD not set, skipping email"; exit 0; }
          python3 send_alert_email.py
